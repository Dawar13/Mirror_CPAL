# Distribution-shift test sets for CORE-07. Read from the cited sources on 2026-11-14; nothing
# large downloaded. Download both on the VM under $HF_HOME. Anything unconfirmed is marked (verify).
imagenet_v2_matched_frequency:
  hf_dataset: vaishaal/ImageNetV2
  hf_revision: d626240be2538720e83103a0e1178d24aca8b12c        # HF API sha, lastModified 2023-03-19, licence mit
  file: imagenetv2-matched-frequency.tar.gz
  file_bytes: 1264079360                                     # HF tree API size (about 1.26 GB)
  file_lfs_oid_prefix: f0c37fdf925916b1                       # first 16 hex of the LFS sha256; check the full value on the VM
  download_url: https://huggingface.co/datasets/vaishaal/ImageNetV2/resolve/main/imagenetv2-matched-frequency.tar.gz
  official_pointer: >-
    The ImageNetV2 README (modestyachts/ImageNetV2, commit 0b0c3fe89058e4c7ee2348938b3f4f706a931bf3)
    says "The actual test sets are stored [in a separate location](https://huggingface.co/datasets/vaishaal/ImageNetV2/tree/main)."
  images: 10000                                              # README: "ImageNetV2 contains three test sets with 10,000 new images each."
  per_class: 10
  format: >-
    tar.gz of class folders; the official loader (modestyachts/ImageNetV2_pytorch,
    imagenetv2_pytorch/ImageNetV2_dataset.py at 14d4456c39fe7f02a665544dd9fc37c1a5f8b635) expects
    the extracted folder "imagenetv2-matched-frequency-format-val", globs "**/*.jpeg" and checks
    V2_DATASET_SIZE = 10000.
  label_mapping: >-
    Folder name is the integer ImageNet-1k class index. The official loader does
    "img, label = Image.open(self.fnames[i]), int(self.fnames[i].parent.name)". The index order is
    sorted WNID order: data/metadata/class_info.json in the ImageNetV2 repo maps cid 0..999 to WNIDs
    in sorted order (cid 0 = n01440764, cid 999 = n15075141), built by
    code/generate_class_info_file.py with "wnids = sorted(imgnet.train_imgs_by_wnid.keys())". This
    is the same order as torchvision ImageFolder on ImageNet train (verify that the project's
    ImageNet label order is sorted-WNID before reusing the linear probe).
  pitfall: >-
    The README suggests datasets.ImageFolder(root='imagenetv2-matched-frequency'). ImageFolder sorts
    folder names as strings ("0", "1", "10", "100", ...), so its class_to_idx is NOT the ImageNet
    index. Use int(folder name) as the label, as the official loader does.
  check_on_vm: "1000 folders named 0 to 999, 10 images each, 10000 in total"
  paper: >-
    Recht, Roelofs, Schmidt, Shankar. Do ImageNet Classifiers Generalize to ImageNet? ICML 2019.
    arXiv 1902.10811 (v2). Venue from Semantic Scholar ("International Conference on Machine Learning", 2019).
  definition_quote: |-
    MatchedFrequency: First, we estimated the selection frequency distribution for each class from the annotated original validation images. We then sampled ten images from our candidate pool for each class according to
  alternative: "clip-benchmark/wds_imagenetv2 (sha 98e9ba6774264333352659a9eb8dc47e3c7164b1), WebDataset shards test/0-3.tar, 1283057231 bytes in total; which ImageNetV2 variant it holds is not stated in the files listed (verify before use)"

imagenet_sketch:
  hf_dataset: songweig/imagenet_sketch
  hf_revision: 0d8b8b5380efe50baae075842505918ad43c88fe       # HF API sha, lastModified 2024-09-10, licence "unknown" on the card
  file: data/ImageNet-Sketch.zip
  file_bytes: 7593573012                                     # HF tree API size (about 7.6 GB); card: "Size of downloaded dataset files: 8.15 GB"
  file_lfs_oid_prefix: 4d3ce6b82a7c48aa
  loader: imagenet_sketch.py (HF datasets script in the same repo; _URL points at https://huggingface.co/datasets/imagenet_sketch/resolve/main/data/ImageNet-Sketch.zip)
  images: 50889                                              # card: "num_examples: 50889"; the paper and card text say 50,000 (50 per class)
  format: "zip of class folders named by WNID, images *.JPEG (the loader keeps only names ending in .JPEG)"
  label_mapping: >-
    The loader maps the folder name (lower-cased WNID) to a class name with IMAGENET2012_CLASSES
    (classes.py, 1000 WNIDs in sorted order) and encodes it with
    ClassLabel(names=list(IMAGENET2012_CLASSES.values())), so the label is the sorted-WNID index.
    The 1000 class-name strings in classes.py are unique (checked), so the name round trip does not
    merge classes.
  recipe_relevant_quote: |-
    For some classes, there are less than 50 images after manually cleaning, and then we augment the data set by flipping and rotating the images.
  recipe_relevant_note: >-
    Important for this project: some Sketch images are flips (and rotations) of other Sketch images
    in the same class. A model that is exactly flip-invariant (Mirror-exact, even part) gives
    identical outputs on such pairs, so they are not independent test points. Report Sketch with
    this caveat, or deduplicate mirrored pairs on the VM (for example by comparing each image with
    the horizontal flip of the others in its class).
  paper: >-
    Wang, Ge, Xing, Lipton. Learning Robust Global Representations by Penalizing Local Predictive
    Power. NeurIPS 2019 (paper header: "33rd Conference on Neural Information Processing Systems
    (NeurIPS 2019), Vancouver, Canada."). arXiv 1905.13549 (v2).
  repository: https://github.com/HaohanWang/ImageNet-Sketch (commit 4d4280057a95c8d00b6ae6c76256d1ed458e445e)
  alternative: "clip-benchmark/wds_imagenet_sketch (sha 751cf0a06276ed52b015c5dfef068f161bd0dfb7), WebDataset shards test/0-8.tar, 8261279311 bytes in total"
verified_on: "2026-11-14"
