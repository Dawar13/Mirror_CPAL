training_data: LVD-142M
training_data_quote: |-
  DINOv2 ViT-B/14 model with registers (optionally) pretrained on the LVD-142M dataset.
training_data_source_url: https://github.com/facebookresearch/dinov2/blob/7764ea0f912e53c92e82eb78a2a1631e92725fc8/dinov2/hub/backbones.py
recipe_flip: "yes"
recipe_quote: |-
  transforms.RandomHorizontalFlip(p=0.5),
recipe_quote_context: >-
  Lines 49 (global crops) and 58 (local crops) of DataAugmentationDINO, under the comment
  "# random resized crop and flip". dinov2/train/train.py (line 184) builds DataAugmentationDINO
  for training.
recipe_source_url: https://github.com/facebookresearch/dinov2/blob/7764ea0f912e53c92e82eb78a2a1631e92725fc8/dinov2/data/augmentations.py#L43-L60
recipe_certainty: >-
  High for the public code. The DINOv2 paper (arXiv 2304.07193) does not state the pre-training
  flip in its text, and no source says the released weights came from exactly this file
  (inferred from the official repository, not stated).
other_augmentations:
  - RandomResizedCrop, bicubic, global and local crops (multi-crop)
  - "ColorJitter(brightness=0.4, contrast=0.4, saturation=0.2, hue=0.1), applied with p=0.8"
  - RandomGrayscale(p=0.2)
  - "GaussianBlur: p=1.0 on global crop 1, p=0.1 on global crop 2, p=0.5 on local crops"
  - RandomSolarize(threshold=128, p=0.2) on global crop 2
notes:
  - >-
    Paper resolution schedule: "we increase the resolution of images to 518 × 518 during a short
    period at the end of pretraining" (arXiv 2304.07193; the multiplication sign is lost in PDF
    text extraction).
  - >-
    The registers paper (Darcet et al., arXiv 2309.16588, Section 3.1) says of its own study runs:
    "We run this method on ImageNet-22k with the ViT-L configuration. We use the official
    repository". The released *_reg hub weights are documented as LVD-142M (quote above).
  - Hub variant uses interpolate_antialias=True and interpolate_offset=0.0 (plain models use False and 0.1).
  - >-
    DINOv2 paper, Section 5 "Model distillation": "For smaller models, we distill them from our
    largest model, the ViT-g, instead of training them from scratch." and "we leverage the same
    training loop with a few exceptions" (the exceptions listed do not mention augmentation).
papers:
  - "Oquab et al., DINOv2: Learning Robust Visual Features without Supervision, arXiv 2304.07193"
  - "Darcet et al., Vision Transformers Need Registers, arXiv 2309.16588"
verified_on: "2026-11-14"
