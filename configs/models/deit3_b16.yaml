recipe_code_context: >-
  new_data_aug_generator (3-Augment) appends RandomHorizontalFlip after RandomResizedCrop
  (line 107) and after Simple Random Crop (line 101). main.py line 243-244 swaps it in when
  --ThreeAugment is set.
recipe_certainty: >-
  High. Both training stages listed for the released ViT-B 224 ImageNet-1k model flip (see notes).
other_augmentations:
  - "3-Augment: one of greyscale, solarisation or Gaussian blur, chosen uniformly (RandomChoice over gray_scale, Solarization, GaussianBlur, each p=1.0)"
  - "ColorJitter(0.3, 0.3, 0.3) from --color-jitter 0.3"
  - RandomResizedCrop (scale 0.08 to 1.0, bicubic) on ImageNet-1k; Simple Random Crop (--src) only for ImageNet-21k recipes
  - Mixup 0.8 and CutMix 1.0 (pre-training command)
notes:
  - >-
    README_revenge.md gives the ViT-B ImageNet-1k pre-training command with --input-size 192,
    --epochs 800, --ThreeAugment, --color-jitter 0.3, then a separate "finetuning for ViT-B, L and
    H at resolution 224x224" command (20 epochs, --aa rand-m9-mstd0.5-inc1, no --ThreeAugment).
    The fine-tune uses deit/datasets.py build_transform, which calls timm create_transform without
    an hflip argument, so timm 0.3.2's default hflip=0.5 applies (timm 0.3.2 wheel,
    timm/data/transforms_factory.py lines 48 and 73-74). Which stage the released
    deit_3_base_224_1k.pth comes from is not stated in the files read (verify); the flip answer is
    the same either way.
  - >-
    The fine-tune's RandAugment (timm) includes Rotate (range [-30, 30] degrees at maximum level),
    ShearX/Y and Translate, but no flips (timm 0.3.2 auto_augment.py _RAND_TRANSFORMS). Relevant to
    the R90 and UD controls only as small-angle rotations.
  - "README_revenge.md: https://github.com/facebookresearch/deit/blob/7e160fe43f0252d17191b71cbb5826254114ea5b/README_revenge.md"
