training_data: >-
  ImageNet-21K images for masked image modelling, with an EVA-CLIP vision encoder as the teacher
  (EVA-02 paper Table 22 "MIM pre-training setting": image data source "IN-21K" for B; MIM
  teacher "EVA-CLIP vision encoder [44]"). timm card: "Pretrain Dataset: ImageNet-22k".
recipe_flip: "yes"
recipe_quote: |-
  transforms.RandomHorizontalFlip(p=0.5),
recipe_quote_context: >-
  First entry of common_transform in DataAugmentationForEVA (EVA-02/asuka/datasets.py line 41),
  followed by RandomResizedCropAndInterpolationWithTwoResolution; used by
  build_eva_pretraining_dataset. Hard-coded, not behind a flag.
recipe_source_url: https://github.com/baaivision/EVA/blob/5623d08bb08a8268c7bc18e1d9b8b4bd651fe4d9/EVA-02/asuka/datasets.py#L34-L53
recipe_certainty: >-
  High for the student's input pipeline. The paper's Table 22 lists random resized crop (0.2, 1)
  but does not name flips; the code does. The MIM target comes from the EVA-CLIP teacher applied
  to the same flipped crop, so the teacher's own training recipe also shapes what is learnt (not
  checked here).
other_augmentations:
