  from scratch; S, B and L are distilled from it.
other_augmentations:
  - same as dinov2_vitb14_reg.yaml
notes:
  - >-
    The SwiGLU MLP changes what a "hidden unit" is: each hidden channel is a product of two
    projections (silu gate times value), so the twin and operator fits on the MLP hidden layer
    need a decision on which activation to use (after the product, before w3, is the natural
    choice). Same issue for EVA-02.
  - About 4.5 GB of weights; 40 blocks, so k = L/2 = 20.
papers:
