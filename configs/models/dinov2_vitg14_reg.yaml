architecture:
  patch_size: 14
  image_size_hub_default: 518
  blocks: 40
  width: 1536
  heads: 24
  mlp_hidden: 4096
  mlp_type: >-
    SwiGLU, not a GELU MLP. dinov2_vitg14_reg passes ffn_layer="swiglufused"; SwiGLUFFNFused sets
    hidden_features = (int(hidden_features * 2 / 3) + 7) // 8 * 8 with hidden_features = 4 x 1536,
    giving 4096. Weights: w12 = Linear(1536, 2 x 4096) (gate and value halves), w3 = Linear(4096, 1536);
    hidden = silu(x1) * x2. With xFormers installed the class inherits xformers.ops.SwiGLU instead
    of the fallback (verify the state-dict key names on the VM).
  mlp_source: https://github.com/facebookresearch/dinov2/blob/7764ea0f912e53c92e82eb78a2a1631e92725fc8/dinov2/layers/swiglu_ffn.py
  registers: 4
  cls_token: 1
  layerscale: true
  arch_source: https://github.com/facebookresearch/dinov2/blob/7764ea0f912e53c92e82eb78a2a1631e92725fc8/dinov2/models/vision_transformer.py
